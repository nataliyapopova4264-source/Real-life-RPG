name: Build REAL LIFE RPG Android v0.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'REAL_LIFE_RPG_Android_0.2.1_Standard_Project.zip'
      - 'goals-v0.3.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project and inject v0.3 features
        run: |
          unzip -q REAL_LIFE_RPG_Android_0.2.1_Standard_Project.zip
          cp goals-v0.3.js REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/src/main/assets/goals-v0.3.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('REAL_LIFE_RPG_Android_0.2.1_Standard_Project')
          index=root/'app/src/main/assets/index.html'
          html=index.read_text(encoding='utf-8')
          assert '</body>' in html and '<script src="goals-v0.3.js">' not in html
          index.write_text(html.replace('</body>','<script src="goals-v0.3.js"></script></body>'),encoding='utf-8')
          build=root/'app/build.gradle'
          content=build.read_text()
          assert "applicationId 'com.realliferpg.app'" in content
          content=content.replace("applicationId 'com.realliferpg.app'","applicationId 'com.realliferpg.app.next'")
          content=content.replace("versionCode 3","versionCode 4").replace("versionName '0.2.1'","versionName '0.3.0'")
          build.write_text(content)
          values=root/'app/src/main/res/values/strings.xml'
          text=values.read_text()
          text=text.replace('<string name="app_name">REAL LIFE RPG</string>','<string name="app_name">REAL LIFE RPG 0.3</string>')
          values.write_text(text)
          PY
      - name: Check bundled JavaScript
        run: |
          node --check goals-v0.3.js
          test -f REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/src/main/assets/goals-v0.3.js
      - name: Build signed debug APK
        working-directory: REAL_LIFE_RPG_Android_0.2.1_Standard_Project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: REAL_LIFE_RPG_v0.3.0_APK
          path: REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
