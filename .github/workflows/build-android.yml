name: Build REAL LIFE RPG Android v0.4.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'REAL_LIFE_RPG_Android_0.2.1_Standard_Project.zip'
      - 'rpg-v0.4.0.html'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q REAL_LIFE_RPG_Android_0.2.1_Standard_Project.zip
          python3 - <<'PY'
          from pathlib import Path
          root=Path('REAL_LIFE_RPG_Android_0.2.1_Standard_Project')
          html=Path('rpg-v0.4.0.html').read_text(encoding='utf-8')
          assert 'REAL LIFE RPG v0.4.0' in html
          (root/'app/src/main/assets/index.html').write_text(html,encoding='utf-8')
          build=root/'app/build.gradle'
          data=build.read_text()
          assert "applicationId 'com.realliferpg.app'" in data
          assert "versionCode 3" in data
          assert "versionName '0.2.1'" in data
          data=data.replace("applicationId 'com.realliferpg.app'","applicationId 'com.realliferpg.app.v04'")
          data=data.replace("versionCode 3","versionCode 5")
          data=data.replace("versionName '0.2.1'","versionName '0.4.0'")
          build.write_text(data)
          values=root/'app/src/main/res/values/strings.xml'
          data=values.read_text()
          data=data.replace('<string name="app_name">REAL LIFE RPG</string>','<string name="app_name">REAL LIFE RPG 0.4</string>')
          values.write_text(data)
          PY
      - name: Check bundled version
        shell: bash
        run: |
          grep -q 'REAL LIFE RPG v0.4.0' REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/src/main/assets/index.html
          grep -q 'com.realliferpg.app.v04' REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/build.gradle
      - name: Build debug APK
        working-directory: REAL_LIFE_RPG_Android_0.2.1_Standard_Project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: REAL_LIFE_RPG_v0.4.0_APK
          path: REAL_LIFE_RPG_Android_0.2.1_Standard_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
