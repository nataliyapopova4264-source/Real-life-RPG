</style></head><body><div class="shell"><aside class="side"><div class="brand">✦ REAL LIFE <b>RPG</b><div class="micro muted">30 ДНЕЙ ПРОКАЧКИ · v0.4.0</div></div><nav id="sidenav"></nav><div class="side-foot">● Офлайн · данные на устройстве</div></aside><main class="main"><div class="top"><div><div class="eyebrow">ПРОКАЧКА РЕАЛЬНОЙ ЖИЗНИ</div><h1 id="screen-title">REAL LIFE RPG</h1></div><span id="date-pill" class="pill"></span></div><div id="content"></div><div class="footer">REAL LIFE RPG v0.4.0 · XP — игровая мотивация, а не медицинский показатель. Данные хранятся локально.</div></main></div><nav class="bottom" id="bottomnav"></nav><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script>
(()=>{'use strict';
const VERSION=4,STORE='real-life-rpg-v4',STEP=500;
const SKILLS=[['appearance','✨','Внешность'],['endurance','⚡','Физическая выносливость'],['gaming','🎮','Игровой скилл'],['speaking','🎙️','Красноречие'],['health','💚','Здоровье']];
const QUESTS=[{id:'hair',name:'Уход за волосами',skill:'appearance',xp:10,desc:'Следовать индивидуально согласованной схеме ухода.',mandatory:true},{id:'face',name:'Уход за лицом',skill:'appearance',xp:10,desc:'Выполнить утренний и вечерний уход по плану.',mandatory:true},{id:'morning',name:'Утренняя зарядка',skill:'endurance',xp:10,desc:'Сделать согласованный короткий комплекс.',mandatory:true},{id:'cardio',name:'Основное кардио',skill:'endurance',xp:20,desc:'25–30 минут умеренной кардионагрузки; дни тренировки можно настроить.',mandatory:true},{id:'tabata',name:'Кардио-Табата',skill:'endurance',xp:10,desc:'8 раундов: 20 секунд работы, 10 секунд отдыха. Только после полного таймера.',mandatory:false}];
const DEFAULT_AVATAR={name:'Бен',hair:'quiff',face:'square',body:'athletic',skin:'medium',hairColor:'brown',outfit:'jacket',accessory:'none'};
const DEFAULT=()=>({version:VERSION,avatar:null,cycleStart:null,penaltyFrom:today(),completed:{},goals:[],claims:[],penalties:{},excused:{},checkpoints:{},settings:{cardioDays:[1,2,3,4,5]},lastSeen:today()});
const el=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=x=>String(x).padStart(2,'0');function today(){return format(new Date())}function format(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function parseDate(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)}function plusDay(v,n){const d=parseDate(v);d.setDate(d.getDate()+n);return format(d)}function diffDays(a,b){return Math.round((parseDate(a)-parseDate(b))/86400000)}
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&format(parseDate(s))===s;
const skillName=id=>SKILLS.find(s=>s[0]===id)?.[2]||'Внешность';const safeSkill=id=>SKILLS.some(s=>s[0]===id)?id:'appearance';
function read(){try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&v.version===VERSION&&v.completed&&v.settings){return {...DEFAULT(),...v}}}catch(_){}return DEFAULT()}
let s=read(),page='hero',formGoalId=null,previewStage=null;const timer={running:false,phase:'ready',round:0,left:20,deadline:0,finished:false,frame:null};
function save(){try{localStorage.setItem(STORE,JSON.stringify(s));return true}catch(e){toast('Недостаточно памяти для сохранения');return false}}
function toast(text){const t=el('toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3400)}
function dayNo(d=today()){return s.cycleStart?diffDays(d,s.cycleStart)+1:0}function cycleDay(d){return s.cycleStart&&diffDays(d,s.cycleStart)>=0&&diffDays(d,s.cycleStart)<30}
function claimed(g,d=today()){return s.claims.some(c=>c.goalId===g.id&&(g.frequency==='once'||c.date===d))}
function goalDue(g,d){return g.frequency==='daily'&&d>=g.startDate&&(!Array.isArray(g.weekdays)||g.weekdays.includes(parseDate(d).getDay()))}
function mandatoryOn(q,d){return q.id!=='cardio'||s.settings.cardioDays.includes(parseDate(d).getDay())}
function settle(){if(!s.cycleStart)return;const till=plusDay(today(),-1);let first=s.penaltyFrom>s.cycleStart?s.penaltyFrom:s.cycleStart,changed=false;for(let d=first;d<=till&&cycleDay(d);d=plusDay(d,1)){if(Object.hasOwn(s.penalties,d))continue;let items=[];if(!s.excused[d]){for(const q of QUESTS){if(q.mandatory&&mandatoryOn(q,d)&&!s.completed[d]?.[q.id])items.push({id:q.id,name:q.name,skill:q.skill,xp:q.xp})}for(const g of s.goals){if(g.required&&goalDue(g,d)&&!s.claims.some(c=>c.goalId===g.id&&c.date===d))items.push({id:g.id,name:g.name,skill:g.skill,xp:g.xp})}}s.penalties[d]=items;changed=true}if(changed)save()}
function events(){const days={};function add(day,skill,n,label,kind){if(!validDate(day))return;(days[day]??=[]).push({skill,n,label,kind})}for(const [day,record] of Object.entries(s.completed)){if(!validDate(day)||!record)continue;for(const q of QUESTS)if(record[q.id])add(day,q.skill,q.xp,q.name,'plus')}for(const c of s.claims){if(validDate(c.date)&&Number.isInteger(c.xp)&&c.xp>0&&c.xp<=1000)add(c.date,safeSkill(c.skill),c.xp,c.name||'Цель','plus')}for(const [d,items] of Object.entries(s.penalties)){if(!Array.isArray(items))continue;for(const x of items)add(d,safeSkill(x.skill),-Number(x.xp),x.name,'minus')}return days}
function score(){const xp=Object.fromEntries(SKILLS.map(([id])=>[id,0])),days=events(),daily={};for(const d of Object.keys(days).sort()){let total=0;const positive=days[d].filter(e=>e.n>0),negative=days[d].filter(e=>e.n<0);for(const x of [...positive,...negative]){const before=xp[x.skill];xp[x.skill]=Math.max(0,before+x.n);total+=xp[x.skill]-before}daily[d]=total}return {xp,daily,total:Object.values(xp).reduce((a,b)=>a+b,0)}}
function lvl(x){return 1+Math.floor(Math.max(0,x)/STEP)}function progress(x){return ((Math.max(0,x)%STEP)/STEP)*100}function stage(sc=score()){return 1+SKILLS.reduce((n,[id])=>n+lvl(sc.xp[id])-1,0)}
function avatarSVG(a=s.avatar,phase=stage()){if(!a)a=DEFAULT_AVATAR;const colors={light:'#efd3b5',medium:'#bf8b66',tan:'#936040',dark:'#654532'},hair={black:'#201c2c',brown:'#51352c',blond:'#d8b875',auburn:'#8b403e',purple:'#8252a6'},skins=colors[a.skin]||colors.medium,hairs=hair[a.hairColor]||hair.brown;const tall=a.body==='slim'?-10:a.body==='strong'?13:0,shoulder=a.body==='slim'?70:a.body==='strong'?104:89;const face=a.face==='round'?'M112 110 Q111 160 160 174 Q209 160 208 110 Q212 50 160 48 Q108 51 112 110Z':a.face==='oval'?'M116 110 Q116 163 160 186 Q204 160 204 110 Q205 48 160 45 Q115 49 116 110Z':a.face==='sharp'?'M113 106 L122 151 L160 182 L198 151 L207 106 Q205 48 160 46 Q114 48 113 106Z':'M109 107 L116 151 Q137 177 160 180 Q183 177 204 151 L211 107 Q208 48 160 45 Q112 48 109 107Z';const coat=a.outfit==='armor'?'#465064':a.outfit==='hoodie'?'#44355c':'#32354d',accent=phase>2?'#b395ff':'#78628f';let sparks='';for(let i=0;i<Math.min(15,phase-1);i++){let x=30+(i*59)%260,y=48+(i*47)%308;sparks+=`<path d="M${x} ${y-5}v10m-5-5h10" stroke="#cfb5ff" stroke-width="${1+(i%3)*.35}" opacity=".8"/>`}const glow=Math.min(.65,.05+(phase-1)*.045),armorLines=Array.from({length:Math.min(12,Math.max(0,phase-1))},(_,i)=>`<path d="M${119+(i%4)*26} ${247+Math.floor(i/4)*25}l9 -8" stroke="#d6b3ff" stroke-width="2" opacity=".85"/>`).join('');let hairstyle='';if(a.hair==='buzz')hairstyle='<path d="M111 94 Q110 38 160 40 Q207 38 210 94 Q183 70 160 74 Q134 70 111 94"/>';else if(a.hair==='long')hairstyle='<path d="M111 110 Q91 30 156 33 Q231 23 211 118 L221 198 L194 184 L201 110 Q178 88 161 88 L122 110 L125 182 L101 193Z"/>';else if(a.hair==='part')hairstyle='<path d="M110 110 Q103 48 156 36 Q213 28 213 107 Q190 81 170 79 Q152 63 147 57 Q147 83 110 110Z"/>';else if(a.hair==='spiky')hairstyle='<path d="M110 109 L101 53 L121 67 L118 32 L142 51 L157 22 L171 48 L190 23 L194 62 L216 46 L209 106 Q172 80 146 86Z"/>';else hairstyle='<path d="M109 108 Q98 61 126 48 L136 31 L154 41 L176 25 L180 43 Q219 34 212 105 Q194 84 176 80 Q136 71 109 108Z"/>';return `<svg viewBox="0 0 320 400" role="img" aria-label="Персонаж ${esc(a.name)}, визуальный этап ${phase}" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="aura"><stop stop-color="#9c6af0" stop-opacity="${glow}"/><stop offset="1" stop-color="#9c6af0" stop-opacity="0"/></radialGradient><linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${coat}"/><stop offset="1" stop-color="#151426"/></linearGradient></defs><ellipse cx="160" cy="192" rx="153" ry="196" fill="url(#aura)"/>${phase>3?`<circle cx="160" cy="187" r="${124+(phase%5)*3}" stroke="#aa8cff" stroke-width="${Math.min(5,phase/4)}" opacity=".48" fill="none"/>`:''}${sparks}<ellipse cx="160" cy="375" rx="94" ry="12" fill="#050309" opacity=".65"/><path d="M${160-shoulder} 263 Q${100-tall} 226 142 219 L178 219 Q${220+tall} 222 ${160+shoulder} 263 L${160+shoulder+5} 389 H${160-shoulder-5}Z" fill="url(#jacket)" stroke="${accent}" stroke-width="2.2"/><path d="M146 194 L145 230 Q160 251 175 230 L174 194" fill="${skins}"/><path d="M136 225 L160 265 L184 225" fill="#141322" stroke="${phase>1?'#a78ae7':'#695a80'}" stroke-width="3"/><path d="M160 264V386" stroke="#aa90d5" stroke-width="2" opacity=".65"/>${a.outfit==='hoodie'?'<path d="M130 230Q160 280 190 230" fill="none" stroke="#86719c" stroke-width="13"/>':''}${a.outfit==='armor'?'<path d="M93 272L123 263L151 292H170L198 263L228 272L212 332H108Z" fill="#46516a" stroke="#8892b1" stroke-width="2"/>':''}${armorLines}<path d="${face}" fill="${skins}" stroke="#694d4b" stroke-width="1.2"/><path d="M126 113 Q140 104 152 113M170 113Q184 104 197 113" stroke="#362b30" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="140" cy="123" rx="5" ry="6" fill="${phase>1?'#89bbce':'#333040'}"/><ellipse cx="180" cy="123" rx="5" ry="6" fill="${phase>1?'#89bbce':'#333040'}"/><path d="M159 131l-5 22h10" fill="none" stroke="#8f6558" stroke-width="2"/><path d="M144 164Q160 ${phase>1?173:168} 176 function levelCard(id,emoji,name,sc){const xp=sc.xp[id],lv=lvl(xp);return `<div class="stat"><div class="row"><strong>${emoji} ${name}</strong><span class="tag">Ур. ${lv}</span></div><div class="bar"><i style="width:${progress(xp)}%"></i></div><div class="row muted small"><span>${xp} XP</span><span>${xp%STEP} / ${STEP} · ещё ${STEP-xp%STEP}</span></div></div>`}
function nav(){const links=[['hero','🧙','Герой'],['quests','📜','Квесты'],['tabata','⏱️','Табата'],['progress','📊','Прогресс'],['goals','🎯','Цели'],['settings','⚙️','Ещё']];for(const id of ['sidenav','bottomnav'])el(id).innerHTML=links.map(([key,ic,name])=>`<button data-nav="${key}" class="${key===page?'active':''}"><span>${ic}</span> ${name}</button>`).join('');const names={hero:'Мой персонаж',quests:'Квесты на сегодня',tabata:'Кардио-Табата',progress:'Прогресс',goals:'Мои цели',settings:'Настройки'};el('screen-title').textContent=s.avatar?names[page]:'Создание персонажа';el('date-pill').textContent=s.cycleStart?`День ${Math.max(1,Math.min(30,dayNo()))} / 30`:'Новый герой'}
function avatarEditor(first=false){return `<div class="${first?'intro':''}"><div class="intro-grid"><div class="card glow"><div class="row"><h2>Предпросмотр</h2><span class="chip">Этап ${first?1:stage()}</span></div><div class="figure big" id="hero-preview">${avatarSVG(first?draftAvatar:s.avatar,first?1:previewStage??stage())}</div>${!first?'<div class="actions"><button class="btn-small btn-secondary" data-action="preview-zero">Было</button><button class="btn-small btn-secondary" data-action="preview-current">Сейчас</button></div>':''}<p class="muted small">Эволюция происходит при повышении уровня любой характеристики. Начальные черты персонажа остаются под твоим контролем.</p></div><div class="card"><h2>${first?'Создай своего героя':'Изменить внешность'}</h2><form id="avatar-form" class="form-grid"><label class="label wide">Имя героя<input name="name" maxlength="24" required value="${esc(draftAvatar.name)}"></label>${selector('hair','Причёска',[['buzz','Короткая'],['quiff','Квифф'],['part','Пробор'],['spiky','Колючая'],['long','Длинная']])}${selector('hairColor','Цвет волос',[['black','Чёрный'],['brown','Каштановый'],['blond','Светлый'],['auburn','Рыжий'],['purple','Фиолетовый']])}${selector('face','Лицо',[['square','Квадратное'],['oval','Овальное'],['round','Круглое'],['sharp','Угловатое']])}${selector('body','Телосложение',[['slim','Худощавое'],['athletic','Спортивное'],['strong','Крепкое']])}${selector('skin','Тон кожи',[['light','Светлый'],['medium','Средний'],['tan','Смуглый'],['dark','Тёмный']])}${selector('outfit','Одежда',[['jacket','Куртка'],['hoodie','Худи'],['armor','Броня']])}${selector('accessory','Аксессуар',[['none','Без'],['glasses','Очки'],['headphones','Наушники'],['earring','Серьга']])}<div class="wide actions"><button type="submit">${first?'Создать героя и начать 30 дней':'Сохранить внешность'}</button>${!first?'<button type="button" class="btn-secondary" data-action="close-editor">Отмена</button>':''}</div></form></div></div></div>`}
function selector(key,label,options){return `<label class="label">${label}<select name="${key}" data-avatar-select="1">${options.map(([v,n])=>`<option value="${v}" ${draftAvatar[key]===v?'selected':''}>${n}</option>`).join('')}</select></label>`}
let draftAvatar={...s.avatar||DEFAULT_AVATAR},editAvatar=false;
function hero(){const sc=score();if(editAvatar)return avatarEditor();const d=s.completed[today()]||{},q=QUESTS.filter(x=>x.mandatory&&mandatoryOn(x,today()));const completed=q.filter(x=>d[x.id]).length;const todays=(events()[today()]||[]).filter(x=>x.n>0).reduce((n,x)=>n+x.n,0);return `<div class="hero-grid"><div class="card glow"><div class="row"><div><div class="eyebrow">ТВОЙ ПЕРСОНАЖ</div><h2 style="font-size:26px;margin:5px 0">${esc(s.avatar.name)}</h2></div><span class="chip">Этап ${stage(sc)}</span></div><div class="figure">${avatarSVG(s.avatar,stage(sc))}</div><div class="actions"><button class="btn-secondary" data-action="open-editor">✎ Изменить внешность</button></div></div><div class="stack"><div class="card"><h2>Сегодняшний прогресс</h2><div class="metricbox"><div><b class="plus">+${todays}</b><small>XP сегодня</small></div><div><b>${completed}/${q.length}</b><small>Обязательные</small></div><div><b>${sc.total}</b><small>XP всего</small></div></div><div class="bar"><i style="width:${q.length?100*completed/q.length:100}%"></i></div><button data-nav="quests">Перейти к квестам →</button></div><div class="card"><h2>Пять характеристик</h2>${SKILLS.map(([id,ic,n])=>levelCard(id,ic,n,sc)).join('')}</div></div></div><div class="notice" style="margin-top:15px">⭐ Новая ступень внешности открывается, когда растёт уровень любой характеристики. Одни XP фиксируют действия, а измеримые результаты — реальный прогресс.</div>`}
function questCard(q,custom=false){const done=custom?claimed(q):!!s.completed[today()]?.[q.id],due=custom?goalDue(q,today()):q.mandatory&&mandatoryOn(q,today());const active=custom?(q.frequency==='once'?!claimed(q):due):true;if(!active)return '';const bonus=!due||custom&&!q.required;return `<div class="task ${done?'done':''}"><div class="row"><div><strong>${esc(q.name)}</strong><span class="small muted">${esc(skillName(q.skill))} · ${bonus?'Бонус':'Обязательно'}</span></div><div class="tag">+${q.xp} XP</div></div><p>${esc(q.desc||'')}</p>${q.id==='tabata'?`<button class="btn-small btn-secondary" data-nav="tabata">⏱ Открыть таймер</button>`:done?`<button class="btn-small btn-secondary" ${custom?'disabled':''} data-action="${custom?'noop':'undo'}" data-id="${esc(q.id)}">${custom?'✓ Выполнено':'✓ Выполнено · отменить'}</button>`:`<button class="btn-small" data-action="${custom?'claim':'complete'}" data-id="${esc(q.id)}">+ Засчитать ${q.xp} XP</button>`}</div>`}
function quests(){const d=s.completed[today()]||{};const req=QUESTS.filter(q=>q.mandatory&&mandatoryOn(q,today()));const dueGoals=s.goals.filter(g=>g.required&&goalDue(g,today()));const n=req.filter(q=>d[q.id]).length+dueGoals.filter(g=>claimed(g)).length,m=req.length+dueGoals.length;return `<div class="grid"><div class="card"><div class="row"><h2>Задания дня</h2><span class="chip ${n===m?'green':''}">${n}/${m}</span></div><div class="bar"><i style="width:${m?100*n/m:100}%"></i></div><p class="muted small">Штраф за обязательный пропуск по завершении дня равен награде. Сегодняшний зачёт можно отменить.</p>${QUESTS.map(q=>questCard(q)).join('')}</div><div class="stack"><div class="card"><div class="row"><h2>Мои цели</h2><button class="btn-small btn-secondary" data-nav="goals">+ Цель</button></div>${s.goals.filter(g=>g.frequency==='once'&&!claimed(g)||goalDue(g,today())).map(g=>questCard(g,true)).join('')||'<div class="empty">Пока нет собственных целей на сегодня.</div>'}</div><div class="card"><h2>Бережный режим</h2><p class="muted small">День восстановления можно освободить от штрафов — XP за невыполненные задания не начисляется.</p><label class="checkbox"><input type="checkbox" id="excused" ${s.excused[today()]?'checked':''}> Освободить сегодня от штрафов</label><p class="small muted">Табата остаётся дополнительным заданием и никогда не штрафуется.</p></div></div></div>`}
function tabata(){const started=timer.phase!=='ready',t=timer;return `<div class="grid"><div class="card" style="text-align:center"><div class="eyebrow" id="timer-phase">${t.phase==='ready'?'ГОТОВ К СТАРТУ':t.phase==='work'?'РАБОТА':t.phase==='rest'?'ОТДЫХ':'ЗАВЕРШЕНО'}</div><div class="timer-face" id="timer-ring"><b id="timer-sec">${Math.ceil(t.left)}</b><span>СЕКУНД</span></div><h2 id="timer-round">${started?'Раунд '+Math.min(8,t.round+1)+' / 8':'8 раундов · 20/10'}</h2><p class="muted" id="timer-move">${t.phase==='work'?MOVES[t.round]:'4 минуты'}</p><div class="actions" style="justify-content:center"><button id="timer-button" data-action="timer-toggle" ${t.finished?'disabled':''}>${t.running?'Ⅱ Пауза':started?'▶ Продолжить':'▶ Старт'}</button><button class="btn-secondary" data-action="timer-reset">↺ Сброс</button></div><div id="timer-rounds" class="rounds">${Array.from({length:8},(_,i)=>`<i class="${i<t.round||t.finished?'done':i===t.round&&started?'on':''}"></i>`).join('')}</div></div><div class="stack"><div class="card"><div class="row"><h2>Бонусная тренировка</h2><span class="tag">+10 XP</span></div><p>8 интервалов: 20 секунд движения и 10 секунд отдыха. Награда выдаётся только за полностью выполненную тренировку.</p><button class="${s.completed[today()]?.tabata?'btn-secondary':''}" data-action="timer-claim" id="timer-claim" ${!t.finished||s.completed[today()]?.tabata?'disabled':''}>${s.completed[today()]?.tabata?'✓ Уже начислено':'🏆 Получить 10 XP'}</button><div class="notice" style="margin-top:15px">Разминка перед запуском, контроль техники и снижение нагрузки по самочувствию. Эта тренировка дополнительная: штрафа за пропуск нет.</div></div><div class="card"><h2>Режим тренировки</h2><p class="muted small">Бег на месте, jumping jack, конькобежец и боксёрский шаг — по два круга. При необходимости замени прыжки на шаги на месте.</p></div></div></div>`}
const MOVES=['Бег на месте','Jumping Jack','Шаги конькобежца','Боксёрский шаг','Бег на месте','Jumping Jack','Шаги конькобежца','Боксёрский шаг'];
function tickTimer(){if(!timer.running)return;let now=performance.now(),guard=0;while(timer.running&&now>=timer.deadline&&guard++<22){const start=timer.deadline;if(timer.phase==='work'){timer.phase='rest';timer.left=10}else if(timer.round===7){timer.phase='done';timer.finished=true;timer.running=false;timer.left=0;break}else{timer.round++;timer.phase='work';timer.left=20}timer.deadline=start+timer.left*1000}if(timer.running)timer.left=Math.max(0,(timer.deadline-now)/1000);updateTimer();if(timer.finished)render()}
function updateTimer(){if(page!=='tabata'||!el('timer-sec'))return;el('timer-sec').textContent=pad(Math.ceil(timer.left));el('timer-phase').textContent=timer.phase==='ready'?'ГОТОВ К СТАРТУ':timer.phase==='done'?'ЗАВЕРШЕНО':(timer.phase==='work'?'РАБОТА':'ОТДЫХ')+(timer.running?'':' · ПАУЗА');el('timer-round').textContent=timer.phase==='ready'?'8 раундов · 20/10':timer.phase==='done'?'8 / 8 раундов':`Раунд ${timer.round+1} / 8`;el('timer-move').textContent=timer.phase==='work'?MOVES[timer.round]:timer.phase==='rest'?'Отдых':timer.phase==='done'?'🏆 Все интервалы завершены':'4 минуты';el('timer-button').textContent=timer.running?'Ⅱ Пауза':timer.phase==='ready'?'▶ Старт':timer.finished?'Завершено':'▶ Продолжить';el('timer-rounds').innerHTML=Array.from({length:8},(_,i)=>`<i class="${i<timer.round||timer.finished?'done':i===timer.round&&timer.phase!=='ready'?'on':''}"></i>`).join('');el('timer-ring').style.borderColor=timer.phase==='rest'?'var(--gold)':timer.finished?'var(--mint)':'var(--purple)'}
function dayEvents(d){return events()[d]||[]}
function progressPage(){const sc=score(),e=events(),dates=Object.keys(e).sort().reverse().slice(0,30),maxBar=Math.max(1,...Object.values(sc.daily).map(Math.abs)),start=s.cycleStart;return `<div class="grid"><div class="card"><h2>Опыт и уровни</h2>${SKILLS.map(([id,ic,n])=>levelCard(id,ic,n,sc)).join('')}<div class="row"><strong>Общий полученный XP с учётом штрафов</strong><span class="tag">${sc.total}</span></div></div><div class="card"><h2>30-дневная история</h2><div class="meterbar">${Array.from({length:30},(_,i)=>{const d=plusDay(start,i),v=sc.daily[d]||0;return `<div title="${d}: ${v} XP" class="${v<0?'neg':''}" style="height:${Math.max(2,Math.abs(v)/maxBar*100)}%"></div>`}).join('')}</div><p class="sectionhint">Каждый столбик — день цикла. Отрицательные изменения показаны другим цветом.</p><h3>События</h3>${dates.length?dates.map(d=>`<div class="logitem"><div><strong>${d}</strong><div class="muted small">${dayEvents(d).map(x=>`${x.n>0?'+':''}${x.n} ${esc(x.label)}`).join(' · ')}</div></div><strong class="${sc.daily[d]<0?'minus':'plus'}">${sc.daily[d]>0?'+':''}${sc.daily[d]} XP</strong></div>`).join(''):'<div class="empty">История пока пуста.</div>'}</div></div><div class="card" style="margin-top:15px"><h2>Контрольные точки</h2><p class="muted small">Дни 1, 7, 14, 21 и 30: важен результат, а не только отметка квеста. Заполняй показатели в одинаковых условиях.</p><div class="choices">${[1,7,14,21,30].map(n=>`<button class="choice ${checkpointDay===n?'active':''}" data-checkpoint="${n}">День ${n}${s.checkpoints[n]?' ✓':''}</button>`).join('')}</div>${checkpointForm()}</div>`}
let checkpointDay=1;
function checkpointForm(){const m=s.checkpoints[checkpointDay]||{};return `<form id="checkpoint-form" class="form-grid"><label class="label">Внешность · уход / самооценка (1–10)<input name="appearance" inputmode="decimal" type="number" min="1" max="10" step="0.1" value="${esc(m.appearance??'')}"></label><label class="label">Выносливость · минуты непрерывной нагрузки<input name="endurance" inputmode="decimal" type="number" min="0" step="0.1" value="${esc(m.endurance??'')}"></label><label class="label">Игра · ошибок в тестовом участке<input name="gaming" type="number" min="0" step="1" value="${esc(m.gaming??'')}"></label><label class="label">Речь · слов-паразитов за 10 минут<input name="speaking" type="number" min="0" step="1" value="${esc(m.speaking??'')}"></label><label class="label">Здоровье · средний сон (ч)<input name="health" type="number" inputmode="decimal" min="0" max="24" step="0.1" value="${esc(m.health??'')}"></label><label class="label wide">Заметки<textarea name="note" maxlength="450">${esc(m.note||'')}</textarea></label><div class="wide actions"><button type="submit">Сохранить контрольную точку</button></div></form>`}
function goalsPage(){return `<div class="grid"><div class="card"><div class="row"><h2>Собственные задания</h2><button class="btn-small" data-action="new-goal">+ Новое</button></div><p class="muted small">Можно развивать все пять характеристик. Ежедневные обязательные цели штрафуются за пропуск; разовые и бонусные — нет.</p>${s.goals.length?s.goals.map(g=>`<div class="task"><div class="row"><div><strong>${esc(g.name)}</strong><div class="small muted">${skillName(g.skill)} · ${g.frequency==='once'?'Разовая':g.required?'Обязательная ежедневная':'Бонусная ежедневная'}</div></div><span class="tag">${g.xp} XP</span></div><p>${esc(g.desc||'')}</p><div class="actions"><button class="btn-small btn-secondary" data-action="edit-goal" data-id="${esc(g.id)}">✎ Править</button><button class="btn-small btn-danger" data-action="delete-goal" data-id="${esc(g.id)}">Удалить</button></div></div>`).join(''):'<div class="empty">Целей пока нет.</div>'}</div><div class="card"><h2 id="goal-form-title">${formGoalId?'Изменить цель':'Новая цель'}</h2>${goalForm()}</div></div>`}
function goalForm(){const g=s.goals.find(g=>g.id===formGoalId)||{name:'',desc:'',xp:10,skill:'gaming',frequency:'daily',required:true,weekdays:[0,1,2,3,4,5,6]};return `<form id="goal-form"><label class="label">Название<input name="name" maxlength="75" required value="${esc(g.name)}"></label><label class="label">Как понять, что цель выполнена<textarea name="desc" maxlength="300">${esc(g.desc)}</textarea></label><div class="form-grid"><label class="label">Характеристика<select name="skill">${SKILLS.map(([id,ic,n])=>`<option value="${id}" ${id===g.skill?'selected':''}>${ic} ${n}</option>`).join('')}</select></label><label class="label">Награда (XP)<input name="xp" type="number" min="1" max="1000" required value="${g.xp}"></label><label class="label">Повторение<select name="frequency"><option value="daily" ${g.frequency==='daily'?'selected':''}>Ежедневная</option><option value="once" ${g.frequency==='once'?'selected':''}>Разовая</option></select></label></div><label class="checkbox"><input name="required" type="checkbox" ${g.required?'checked':''}> Штрафовать за пропуск в дни задания</label><div class="small muted">Дни недели для повторяющейся цели</div><div class="days" id="goal-weekdays">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map((n,i)=>`<button type="button" class="choice ${g.weekdays?.includes(i)?'active':''}" data-weekday="${i}">${n}</button>`).join('')}</div><div class="actions"><button type="submit">Сохранить цель</button>${formGoalId?'<button type="button" class="btn-secondary" data-action="cancel-goal">Отмена</button>':''}</div></form>`}
function settingsPage(){return `<div class="grid"><div class="card"><h2>Дни основного кардио</h2><p class="muted small">По умолчанию 5 тренировочных дней в неделю, два дня без обязательного кардио. В остальные дни кардио можно выполнить дополнительно.</p><div class="days">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map((n,i)=>`<button class="choice ${s.settings.cardioDays.includes(i)?'active':''}" data-cardio-day="${i}">${n}</button>`).join('')}</div><hr><h2>Персонаж</h2><div class="actions"><button data-action="open-editor">Изменить внешность</button></div><hr><h2>Новый цикл</h2><p class="muted small">Полный сброс выполняется только после подтверждения. Сначала сохрани копию данных.</p><button class="btn-danger" data-action="reset">Начать с нуля</button></div><div class="card"><h2>Резервная копия / перенос v0.3</h2><p class="muted small">Экспортируй JSON из v0.3 во вкладке «Цели» или «Журнал». Вставь его ниже: старые записи объединятся без повторного XP.</p><div class="actions"><button data-action="export">↓ Показать копию v0.4</button><button class="btn-secondary" data-action="download">↓ Сохранить JSON</button></div><label class="label">Резервная копия<textarea id="backup" placeholder="JSON для экспорта или импорта" spellcheck="false" style="min-height:190px;font:12px/1.45 monospace"></textarea></label><button data-action="import">↑ Импортировать JSON</button><div class="notice" style="margin-top:14px">Данные приложения остаются на устройстве. Версия 0.4 устанавливается отдельно от 0.3, поэтому перенос между ними выполняется через JSON.</div></div></div>`}
function render(){settle();nav();draftAvatar={...s.avatar||DEFAULT_AVATAR};const c=el('content');if(!s.avatar){page='hero';c.innerHTML=avatarEditor(true);return}if(!s.cycleStart){page='hero';c.innerHTML='<div class="card">Нужно начать цикл. <button data-action="begin-cycle">Начать</button></div>';return}if(page==='hero')c.innerHTML=hero();if(page==='quests')c.innerHTML=quests();if(page==='tabata')c.innerHTML=tabata();if(page==='progress')c.innerHTML=progressPage();if(page==='goals')c.innerHTML=goalsPage();if(page==='settings')c.innerHTML=settingsPage()}
function startGoal(g){return s.goals.find(x=>x.id===g)}
function grant(id){if(!cycleDay(today()))return toast('30-дневный цикл завершён');if(s.completed[today()]?.[id])return;const q=QUESTS.find(x=>x.id===id);if(!q||q.id==='tabata'&&!timer.finished)return;const d=today();(s.completed[d]??={})[id]=true;save();render();toast('Засчитано: +'+q.xp+' XP')}
function importBackup(raw){let v;try{v=JSON.parse(raw)}catch(_){return toast('Ошибка: некорректный JSON')}if(!v||typeof v!=='object'||!v.logs&&!v.completed)return toast('Это не резервная копия REAL LIFE RPG');const isV4=v.version===4&&v.completed;const pristine=!Object.keys(s.completed).length&&!s.claims.length;const logs=isV4?v.completed:v.logs;for(const [d,rec] of Object.entries(logs||{})){if(!validDate(d)||!rec||typeof rec!=='object')continue;(s.completed[d]??={});for(const q of QUESTS)if(rec[q.id])s.completed[d][q.id]=true}const goals=isV4?v.goals:v.customGoals,claims=isV4?v.claims:v.customClaims;for(const g of Array.isArray(goals)?goals:[]){if(!g||typeof g.id!=='string'||s.goals.some(x=>x.id===g.id))continue;const xp=Number(g.xp);if(!Number.isInteger(xp)||xp<1||xp>1000||!String(g.name||'').trim())continue;s.goals.push({id:g.id.slice(0,64),name:String(g.name).slice(0,75),desc:String(g.desc||'').slice(0,300),xp,skill:safeSkill(g.skill),frequency:g.frequency==='once'?'once':'daily',required:isV4?!!g.required:false,weekdays:Array.isArray(g.weekdays)?g.weekdays.filter(x=>Number.isInteger(x)&&x>=0&&x<=6):[0,1,2,3,4,5,6],startDate:isV4&&validDate(g.startDate)?g.startDate:today()})}for(const c of Array.isArray(claims)?claims:[]){if(!c||typeof c.goalId!=='string'||!validDate(c.date)||s.claims.some(x=>x.goalId===c.goalId&&x.date===c.date))continue;const xp=Number(c.xp);if(!Number.isInteger(xp)||xp<1||xp>1000)continue;s.claims.push({goalId:c.goalId,date:c.date,name:String(c.name||'Цель').slice(0,75),skill:safeSkill(c.skill),xp})}if(isV4){if(pristine){if(validDate(v.cycleStart))s.cycleStart=v.cycleStart;if(v.avatar&&typeof v.avatar==='object')s.avatar={...DEFAULT_AVATAR,...v.avatar};if(v.settings&&Array.isArray(v.settings.cardioDays))s.settings.cardioDays=v.settings.cardioDays.filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(v.excused&&typeof v.excused==='object')s.excused={...v.excused}}for(const [d,p] of Object.entries(v.penalties||{}))if(validDate(d)&&Array.isArray(p)&&!s.penalties[d])s.penalties[d]=p.filter(x=>Number.isInteger(x.xp)&&x.xp>0&&x.xp<=1000);for(const [k,vv] of Object.entries(v.checkpoints||{}))if(!s.checkpoints[k])s.checkpoints[k]=vv}if(!s.avatar)s.avatar={...DEFAULT_AVATAR,...(isV4?v.avatar:{})};if(!s.cycleStart){const past=Object.keys(s.completed).filter(validDate).sort()[0];s.cycleStart=isV4&&validDate(v.cycleStart)?v.cycleStart:(past&&diffDays(today(),past)<30?past:today())}s.penaltyFrom=today();save();render();toast('Импорт успешен: XP и цели объединены')}
function submitGoal(f){const data=new FormData(f),name=String(data.get('name')||'').trim(),xp=Number(data.get('xp')),frequency=data.get('frequency')==='once'?'once':'daily',weekdays=[...el('goal-weekdays').querySelectorAll('.active')].map(b=>Number(b.dataset.weekday));if(!name||!Number.isInteger(xp)||xp<1||xp>1000)return toast('Проверь название и XP (1–1000)');if(frequency==='daily'&&!weekdays.length)return toast('Выбери хотя бы один день');const old=startGoal(formGoalId),g={id:old?.id||'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:name.slice(0,75),desc:String(data.get('desc')||'').slice(0,300),xp,skill:safeSkill(data.get('skill')),frequency,required:frequency==='daily'&&data.get('required')==='on',weekdays,startDate:old?.startDate||today()};if(old)s.goals[s.goals.indexOf(old)]=g;else s.goals.push(g);formGoalId=null;save();render();toast('Цель сохранена')}
function saveAvatar(f){const data=new FormData(f),a={};const whitelist={hair:['buzz','quiff','part','spiky','long'],hairColor:['black','brown','blond','auburn','purple'],face:['square','oval','round','sharp'],body:['slim','athletic','strong'],skin:['light','medium','tan','dark'],outfit:['jacket','hoodie','armor'],accessory:['none','glasses','headphones','earring']};for(const [k,options] of Object.entries(whitelist)){const v=String(data.get(k)||'');a[k]=options.includes(v)?v:DEFAULT_AVATAR[k]}a.name=String(data.get('name')||'Герой').trim().slice(0,24)||'Герой';s.avatar=a;if(!s.cycleStart){s.cycleStart=today();s.penaltyFrom=today()}editAvatar=false;previewStage=null;save();render();toast('Персонаж сохранён')}
function changePage(p){if(!s.avatar)return;if(['hero','quests','tabata','progress','goals','settings'].includes(p)){page=p;editAvatar=false;render();window.scrollTo(0,0)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){changePage(b.dataset.nav);return}if(b.dataset.weekday!==undefined){b.classList.toggle('active');return}if(b.dataset.cardioDay!==undefined){const i=Number(b.dataset.cardioDay),a=s.settings.cardioDays;s.settings.cardioDays=a.includes(i)?a.filter(x=>x!==i):[...a,i].sort();save();render();return}if(b.dataset.checkpoint){checkpointDay=Number(b.dataset.checkpoint);render();return}const action=b.dataset.action,id=b.dataset.id;if(!action)return;
switch(action){case 'complete':grant(id);break;case 'undo':if(s.completed[today()]){delete s.completed[today()][id];save();render();toast('Отметка отменена')}break;case 'claim':{const g=startGoal(id);if(!g||claimed(g)||!cycleDay(today()))return;const d=today();s.claims.push({goalId:g.id,date:d,name:g.name,xp:g.xp,skill:g.skill});save();render();toast('Цель: +'+g.xp+' XP');break}case 'open-editor':page='hero';editAvatar=true;previewStage=null;render();break;case 'close-editor':editAvatar=false;render();break;case 'preview-zero':previewStage=1;el('hero-preview').innerHTML=avatarSVG(s.avatar,1);break;case 'preview-current':previewStage=null;el('hero-preview').innerHTML=avatarSVG(s.avatar,stage());break;case 'new-goal':formGoalId=null;render();break;case 'edit-goal':formGoalId=id;render();break;case 'cancel-goal':formGoalId=null;render();break;case 'delete-goal':if(!confirm('Удалить цель? Ранее начисленный XP сохранится.'))return;s.goals=s.goals.filter(g=>g.id!==id);formGoalId=null;save();render();break;case 'timer-toggle':if(timer.finished)return;if(timer.running){timer.left=Math.max(0,(timer.deadline-performance.now())/1000);timer.running=false}else{if(timer.phase==='ready'){timer.phase='work';timer.round=0;timer.left=20}timer.running=true;timer.deadline=performance.now()+timer.left*1000}updateTimer();break;case 'timer-reset':timer.running=false;timer.phase='ready';timer.round=0;timer.left=20;timer.finished=false;render();break;case 'timer-claim':grant('tabata');break;case 'export':el('backup').value=JSON.stringify(s,null,2);el('backup').select();toast('Копия сформирована');break;case 'download':{const content=JSON.stringify(s,null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.saveBackup==='function'){window.AndroidBridge.saveBackup(content);break}const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='REAL-LIFE-RPG-0.4.0-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);break}case 'import':if(confirm('Импортировать данные из текстового поля? Данные объединятся.'))importBackup(el('backup').value);break;case 'reset':if(confirm('Удалить весь прогресс? Рекомендуем заранее экспортировать JSON.')){s=DEFAULT();draftAvatar={...DEFAULT_AVATAR};editAvatar=false;timer.running=false;save();page='hero';render()}break;case 'begin-cycle':s.cycleStart=today();s.penaltyFrom=today();save();render();break;default:break}});
document.addEventListener('input',e=>{const f=el('avatar-form');if(f&&f.contains(e.target)){const data=new FormData(f);const a={...draftAvatar};for(const [k,v]of data)a[k]=v;draftAvatar=a;el('hero-preview').innerHTML=avatarSVG(a,s.avatar?previewStage??stage():1)}});
document.addEventListener('change',e=>{if(e.target.id==='excused'){s.excused[today()]=e.target.checked;save();render();toast(e.target.checked?'Сегодня без штрафов':'Обычные правила восстановлены')}});
document.addEventListener('submit',e=>{if(e.target.id==='avatar-form'){e.preventDefault();saveAvatar(e.target)}if(e.target.id==='goal-form'){e.preventDefault();submitGoal(e.target)}if(e.target.id==='checkpoint-form'){e.preventDefault();const data=new FormData(e.target),r={};for(const [k,v] of data)if(v!==''&&v!=null)r[k]=k==='note'?String(v).slice(0,450):Number(v);s.checkpoints[checkpointDay]=r;save();render();toast('Контрольная точка сохранена')}});
setInterval(()=>{tickTimer();if(s.lastSeen!==today()){s.lastSeen=today();settle();save();render()}},200);document.addEventListener('visibilitychange',()=>{if(!document.hidden){settle();render()}});
render();
})();
</script></body></html>
