function read(){try{const raw=localStorage.getItem(STORE)||localStorage.getItem('real-life-rpg-v7')||localStorage.getItem('real-life-rpg-v6')||localStorage.getItem('real-life-rpg-v5')||localStorage.getItem('real-life-rpg-v4')||'null';const v=JSON.parse(raw);if(v&&v.completed){return {...DEFAULT(),...v,version:VERSION,settings:{...DEFAULT().settings,...(v.settings||{})}}}}catch(_){}return DEFAULT()}
let s=read(),page='hero',formGoalId=null,previewStage=null;if(s.avatar)s.avatar={...DEFAULT_AVATAR,...s.avatar};const timer={running:false,phase:'ready',round:0,left:20,deadline:0,finished:false,frame:null};
function save(){try{localStorage.setItem(STORE,JSON.stringify(s));return true}catch(e){toast('Недостаточно памяти для сохранения');return false}}
function toast(text){const t=el('toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3400)}
function dayNo(d=today()){return s.cycleStart?diffDays(d,s.cycleStart)+1:0}function cycleDay(d){return s.cycleStart&&diffDays(d,s.cycleStart)>=0&&diffDays(d,s.cycleStart)<30}
function claimed(g,d=today()){return s.claims.some(c=>c.goalId===g.id&&(g.frequency==='once'||c.date===d))}
function goalDue(g,d){return g.frequency==='daily'&&d>=g.startDate&&(!Array.isArray(g.weekdays)||g.weekdays.includes(parseDate(d).getDay()))}
function mandatoryOn(q,d){return q.id!=='cardio'||s.settings.cardioDays.includes(parseDate(d).getDay())}
function settle(){if(!s.cycleStart)return;const till=plusDay(today(),-1);let first=s.penaltyFrom>s.cycleStart?s.penaltyFrom:s.cycleStart,changed=false;for(let d=first;d<=till&&cycleDay(d);d=plusDay(d,1)){if(Object.hasOwn(s.penalties,d))continue;let items=[];if(!s.excused[d]){for(const q of QUESTS){if(q.mandatory&&mandatoryOn(q,d)&&!s.completed[d]?.[q.id])items.push({id:q.id,name:q.name,skill:q.skill,xp:q.xp})}for(const g of s.goals){if(g.required&&goalDue(g,d)&&!s.claims.some(c=>c.goalId===g.id&&c.date===d))items.push({id:g.id,name:g.name,skill:g.skill,xp:g.xp})}}s.penalties[d]=items;changed=true}if(changed)save()}
function events(){const days={};function add(day,skill,n,label,kind){if(!validDate(day))return;(days[day]??=[]).push({skill,n,label,kind})}for(const [day,record] of Object.entries(s.completed)){if(!validDate(day)||!record)continue;for(const q of QUESTS)if(record[q.id])add(day,q.skill,q.xp,q.name,'plus')}for(const c of s.claims){if(validDate(c.date)&&Number.isInteger(c.xp)&&c.xp>0&&c.xp<=1000)add(c.date,safeSkill(c.skill),c.xp,c.name||'Цель','plus')}for(const [d,items] of Object.entries(s.penalties)){if(!Array.isArray(items))continue;for(const x of items)add(d,safeSkill(x.skill),-Number(x.xp),x.name,'minus')}return days}
function score(){const xp=Object.fromEntries(SKILLS.map(([id])=>[id,0])),days=events(),daily={};for(const d of Object.keys(days).sort()){let total=0;const positive=days[d].filter(e=>e.n>0),negative=days[d].filter(e=>e.n<0);for(const x of [...positive,...negative]){const before=xp[x.skill];xp[x.skill]=Math.max(0,before+x.n);total+=xp[x.skill]-before}daily[d]=total}return {xp,daily,total:Object.values(xp).reduce((a,b)=>a+b,0)}}
function lvl(x){return 1+Math.floor(Math.max(0,x)/STEP)}function progress(x){return ((Math.max(0,x)%STEP)/STEP)*100}function stage(sc=score()){return 1+SKILLS.reduce((n,[id])=>n+lvl(sc.xp[id])-1,0)}

function quests(){const d=s.completed[today()]||{};const req=QUESTS.filter(q=>q.mandatory&&mandatoryOn(q,today()));const dueGoals=s.goals.filter(g=>g.required&&goalDue(g,today()));const n=req.filter(q=>d[q.id]).length+dueGoals.filter(g=>claimed(g)).length,m=req.length+dueGoals.length;return `<div class="grid"><div class="card"><div class="row"><h2>Задания дня</h2><span class="chip ${n===m?'green':''}">${n}/${m}</span></div><div class="bar"><i style="width:${m?100*n/m:100}%"></i></div><p class="muted small">Штраф за обязательный пропуск по завершении дня равен награде. Сегодняшний зачёт можно отменить.</p>${QUESTS.map(q=>questCard(q)).join('')}</div><div class="stack"><div class="card"><div class="row"><h2>Мои цели</h2><button class="btn-small btn-secondary" data-nav="goals">+ Цель</button></div>${s.goals.filter(g=>g.frequency==='once'&&!claimed(g)||goalDue(g,today())).map(g=>questCard(g,true)).join('')||'<div class="empty">Пока нет собственных целей на сегодня.</div>'}</div><div class="card"><h2>Бережный режим</h2><p class="muted small">День восстановления можно освободить от штрафов — XP за невыполненные задания не начисляется.</p><label class="checkbox"><input type="checkbox" id="excused" ${s.excused[today()]?'checked':''}> Освободить сегодня от штрафов</label><p class="small muted">Табата остаётся дополнительным заданием и никогда не штрафуется.</p></div></div></div>`}

function tickTimer(){if(!timer.running)return;let now=performance.now(),guard=0;while(timer.running&&now>=timer.deadline&&guard++<22){const start=timer.deadline;if(timer.phase==='work'){timer.phase='rest';timer.left=10}else if(timer.round===7){timer.phase='done';timer.finished=true;timer.running=false;timer.left=0;break}else{timer.round++;timer.phase='work';timer.left=20}timer.deadline=start+timer.left*1000}if(timer.running)timer.left=Math.max(0,(timer.deadline-now)/1000);updateTimer();if(timer.finished)render()}
function updateTimer(){if(page!=='tabata'||!el('timer-sec'))return;el('timer-sec').textContent=pad(Math.ceil(timer.left));el('timer-phase').textContent=timer.phase==='ready'?'ГОТОВ К СТАРТУ':timer.phase==='done'?'ЗАВЕРШЕНО':(timer.phase==='work'?'РАБОТА':'ОТДЫХ')+(timer.running?'':' · ПАУЗА');el('timer-round').textContent=timer.phase==='ready'?'8 раундов · 20/10':timer.phase==='done'?'8 / 8 раундов':`Раунд ${timer.round+1} / 8`;el('timer-move').textContent=timer.phase==='work'?MOVES[timer.round]:timer.phase==='rest'?'Отдых':timer.phase==='done'?'🏆 Все интервалы завершены':'4 минуты';el('timer-button').textContent=timer.running?'Ⅱ Пауза':timer.phase==='ready'?'▶ Старт':timer.finished?'Завершено':'▶ Продолжить';el('timer-rounds').innerHTML=Array.from({length:8},(_,i)=>`<i class="${i<timer.round||timer.finished?'done':i===timer.round&&timer.phase!=='ready'?'on':''}"></i>`).join('');el('timer-ring').style.borderColor=timer.phase==='rest'?'var(--gold)':timer.finished?'var(--mint)':'var(--purple)'}

function progressPage(){const sc=score(),e=events(),dates=Object.keys(e).sort().reverse().slice(0,30),maxBar=Math.max(1,...Object.values(sc.daily).map(Math.abs)),start=s.cycleStart;return `<div class="grid"><div class="card"><h2>Опыт и уровни</h2>${SKILLS.map(([id,ic,n])=>levelCard(id,ic,n,sc)).join('')}<div class="row"><strong>Общий полученный XP с учётом штрафов</strong><span class="tag">${sc.total}</span></div></div><div class="card"><h2>30-дневная история</h2><div class="meterbar">${Array.from({length:30},(_,i)=>{const d=plusDay(start,i),v=sc.daily[d]||0;return `<div title="${d}: ${v} XP" class="${v<0?'neg':''}" style="height:${Math.max(2,Math.abs(v)/maxBar*100)}%"></div>`}).join('')}</div><p class="sectionhint">Каждый столбик — день цикла. Отрицательные изменения показаны другим цветом.</p><h3>События</h3>${dates.length?dates.map(d=>`<div class="logitem"><div><strong>${d}</strong><div class="muted small">${dayEvents(d).map(x=>`${x.n>0?'+':''}${x.n} ${esc(x.label)}`).join(' · ')}</div></div><strong class="${sc.daily[d]<0?'minus':'plus'}">${sc.daily[d]>0?'+':''}${sc.daily[d]} XP</strong></div>`).join(''):'<div class="empty">История пока пуста.</div>'}</div></div><div class="card" style="margin-top:15px"><h2>Контрольные точки</h2><p class="muted small">Дни 1, 7, 14, 21 и 30: важен результат, а не только отметка квеста. Заполняй показатели в одинаковых условиях.</p><div class="choices">${[1,7,14,21,30].map(n=>`<button class="choice ${checkpointDay===n?'active':''}" data-checkpoint="${n}">День ${n}${s.checkpoints[n]?' ✓':''}</button>`).join('')}</div>${checkpointForm()}</div>`}

function importBackup(raw){let v;try{v=JSON.parse(raw)}catch(_){return toast('Ошибка: некорректный JSON')}if(!v||typeof v!=='object'||!v.logs&&!v.completed)return toast('Это не резервная копия REAL LIFE RPG');const isV4=Number.isInteger(v.version)&&v.version>=4&&v.completed&&typeof v.completed==='object'&&!Array.isArray(v.completed);const pristine=!Object.keys(s.completed).length&&!s.claims.length;const logs=isV4?v.completed:v.logs;for(const [d,rec] of Object.entries(logs||{})){if(!validDate(d)||!rec||typeof rec!=='object')continue;(s.completed[d]??={});for(const q of QUESTS)if(rec[q.id])s.completed[d][q.id]=true}const goals=isV4?v.goals:v.customGoals,claims=isV4?v.claims:v.customClaims;for(const g of Array.isArray(goals)?goals:[]){if(!g||typeof g.id!=='string'||s.goals.some(x=>x.id===g.id))continue;const xp=Number(g.xp);if(!Number.isInteger(xp)||xp<1||xp>1000||!String(g.name||'').trim())continue;s.goals.push({id:g.id.slice(0,64),name:String(g.name).slice(0,75),desc:String(g.desc||'').slice(0,300),xp,skill:safeSkill(g.skill),frequency:g.frequency==='once'?'once':'daily',required:isV4?!!g.required:false,weekdays:Array.isArray(g.weekdays)?g.weekdays.filter(x=>Number.isInteger(x)&&x>=0&&x<=6):[0,1,2,3,4,5,6],startDate:isV4&&validDate(g.startDate)?g.startDate:today()})}for(const c of Array.isArray(claims)?claims:[]){if(!c||typeof c.goalId!=='string'||!validDate(c.date)||s.claims.some(x=>x.goalId===c.goalId&&x.date===c.date))continue;const xp=Number(c.xp);if(!Number.isInteger(xp)||xp<1||xp>1000)continue;s.claims.push({goalId:c.goalId,date:c.date,name:String(c.name||'Цель').slice(0,75),skill:safeSkill(c.skill),xp})}if(isV4){if(pristine){if(validDate(v.cycleStart))s.cycleStart=v.cycleStart;if(v.avatar&&typeof v.avatar==='object')s.avatar={...DEFAULT_AVATAR,...v.avatar};if(v.settings&&Array.isArray(v.settings.cardioDays))s.settings.cardioDays=v.settings.cardioDays.filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(v.excused&&typeof v.excused==='object')s.excused={...v.excused}}for(const [d,p] of Object.entries(v.penalties||{}))if(validDate(d)&&Array.isArray(p)&&!s.penalties[d])s.penalties[d]=p.filter(x=>Number.isInteger(x.xp)&&x.xp>0&&x.xp<=1000);for(const [k,vv] of Object.entries(v.checkpoints||{}))if(!s.checkpoints[k])s.checkpoints[k]=vv}if(!s.avatar)s.avatar={...DEFAULT_AVATAR,...(isV4?v.avatar:{})};if(!s.cycleStart){const past=Object.keys(s.completed).filter(validDate).sort()[0];s.cycleStart=isV4&&validDate(v.cycleStart)?v.cycleStart:(past&&diffDays(today(),past)<30?past:today())}s.penaltyFrom=today();save();render();toast('Импорт успешен: XP и цели объединены')}
function submitGoal(f){const data=new FormData(f),name=String(data.get('name')||'').trim(),xp=Number(data.get('xp')),frequency=data.get('frequency')==='once'?'once':'daily',weekdays=[...el('goal-weekdays').querySelectorAll('.active')].map(b=>Number(b.dataset.weekday));if(!name||!Number.isInteger(xp)||xp<1||xp>1000)return toast('Проверь название и XP (1–1000)');if(frequency==='daily'&&!weekdays.length)return toast('Выбери хотя бы один день');const old=startGoal(formGoalId),g={id:old?.id||'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:name.slice(0,75),desc:String(data.get('desc')||'').slice(0,300),xp,skill:safeSkill(data.get('skill')),frequency,required:frequency==='daily'&&data.get('required')==='on',weekdays,startDate:old?.startDate||today()};if(old)s.goals[s.goals.indexOf(old)]=g;else s.goals.push(g);formGoalId=null;save();render();toast('Цель сохранена')}
function saveAvatar(f){const data=new FormData(f),a={};const whitelist={gender:['male','female'],hair:['buzz','quiff','part','spiky','long','bob','ponytail','braid','undercut','curls','pixie','mohawk','slick','twintails','wolfcut'],hairColor:['black','brown','blond','auburn','purple','silver','blue','pink'],eyeColor:['brown','blue','green','gray','violet','amber','teal','red'],face:['square','oval','round','sharp','heart'],body:['petite','slim','athletic','strong','broad','curvy'],skin:['light','medium','tan','dark'],outfit:['jacket','hoodie','armor','coat','techwear'],accessory:['none','glasses','headphones','earring','visor','mask','chain']};for(const [k,options] of Object.entries(whitelist)){const v=String(data.get(k)||'');a[k]=options.includes(v)?v:DEFAULT_AVATAR[k]}a.name=String(data.get('name')||randomName(a.gender||'male')).trim().slice(0,24)||randomName(a.gender||'male');s.avatar={...DEFAULT_AVATAR,...a};if(!s.cycleStart){s.cycleStart=today();s.penaltyFrom=today()}editAvatar=false;previewStage=null;save();render();toast('Персонаж сохранён')}
function changePage(p){if(!s.avatar)return;if(['hero','quests','tabata','progress','goals','settings'].includes(p)){page=p;editAvatar=false;render();window.scrollTo(0,0)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){changePage(b.dataset.nav);return}if(b.dataset.evo){previewStage=Math.max(1,Math.min(6,Number(b.dataset.evo)));if(el('avatar-form'))syncAvatarEditor();else render();return}if(b.dataset.preset){applyPreset(b.dataset.preset);return}if(b.dataset.weekday!==undefined){b.classList.toggle('active');return}if(b.dataset.cardioDay!==undefined){const i=Number(b.dataset.cardioDay),a=s.settings.cardioDays;s.settings.cardioDays=a.includes(i)?a.filter(x=>x!==i):[...a,i].sort();save();render();return}if(b.dataset.checkpoint){checkpointDay=Number(b.dataset.checkpoint);render();return}const action=b.dataset.action,id=b.dataset.id;if(!action)return;
switch(action){case 'complete':grant(id);break;case 'undo':if(s.completed[today()]){delete s.completed[today()][id];save();render();toast('Отметка отменена')}break;case 'claim':{const g=startGoal(id);if(!g||claimed(g)||!cycleDay(today()))return;const d=today();s.claims.push({goalId:g.id,date:d,name:g.name,xp:g.xp,skill:g.skill});save();render();toast('Цель: +'+g.xp+' XP');break}case 'evo-actual':previewStage=null;render();break;case 'open-editor':page='hero';editAvatar=true;previewStage=null;render();break;case 'close-editor':editAvatar=false;render();break;case 'random-avatar':applyDraftAvatar(randomAvatar());toast('Случайный герой создан');break;case 'preview-zero':previewStage=1;if(el('avatar-form'))syncAvatarEditor();else render();break;case 'preview-current':previewStage=null;if(el('avatar-form'))syncAvatarEditor();else render();break;case 'new-goal':formGoalId=null;render();break;case 'edit-goal':formGoalId=id;render();break;case 'cancel-goal':formGoalId=null;render();break;case 'delete-goal':if(!confirm('Удалить цель? Ранее начисленный XP сохранится.'))return;s.goals=s.goals.filter(g=>g.id!==id);formGoalId=null;save();render();break;case 'timer-toggle':if(timer.finished)return;if(timer.running){timer.left=Math.max(0,(timer.deadline-performance.now())/1000);timer.running=false}else{if(timer.phase==='ready'){timer.phase='work';timer.round=0;timer.left=20}timer.running=true;timer.deadline=performance.now()+timer.left*1000}updateTimer();break;case 'timer-reset':timer.running=false;timer.phase='ready';timer.round=0;timer.left=20;timer.finished=false;render();break;case 'timer-claim':grant('tabata');break;case 'export':el('backup').value=JSON.stringify(s,null,2);el('backup').select();toast('Копия сформирована');break;case 'download':{const content=JSON.stringify(s,null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.saveBackup==='function'){window.AndroidBridge.saveBackup(content);break}const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='REAL-LIFE-RPG-0.4.5-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);break}case 'import':if(confirm('Импортировать данные из текстового поля? Данные объединятся.'))importBackup(el('backup').value);break;case 'reset':if(confirm('Удалить весь прогресс? Рекомендуем заранее экспортировать JSON.')){s=DEFAULT();draftAvatar={...DEFAULT_AVATAR};editAvatar=false;timer.running=false;save();page='hero';render()}break;case 'begin-cycle':s.cycleStart=today();s.penaltyFrom=today();save();render();break;default:break}});
document.addEventListener('input',e=>{const f=el('avatar-form');if(f&&f.contains(e.target)){const data=new FormData(f);const a={...draftAvatar};for(const [k,v]of data)a[k]=v;draftAvatar={...DEFAULT_AVATAR,...a};if(!draftAvatar.name)draftAvatar.name=randomName(draftAvatar.gender);syncAvatarEditor()}});
document.addEventListener('change',e=>{if(e.target.id==='excused'){s.excused[today()]=e.target.checked;save();render();toast(e.target.checked?'Сегодня без штрафов':'Обычные правила восстановлены')}});
document.addEventListener('submit',e=>{if(e.target.id==='avatar-form'){e.preventDefault();saveAvatar(e.target)}if(e.target.id==='goal-form'){e.preventDefault();submitGoal(e.target)}if(e.target.id==='checkpoint-form'){e.preventDefault();const data=new FormData(e.target),r={};for(const [k,v] of data)if(v!==''&&v!=null)r[k]=k==='note'?String(v).slice(0,450):Number(v);s.checkpoints[checkpointDay]=r;save();render();toast('Контрольная точка сохранена')}});
